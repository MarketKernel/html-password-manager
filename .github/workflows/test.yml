name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, where tests/app.mjs looks.
      # The extension's test (tests/extension.mjs) is left out here: on the runners it fails now and
      # then, a click in the side panel lost, for a reason not found, and passes on a computer.
      # `npm run check` runs it before a commit.
      - run: npm run test:page

      # The single HTML file must not pull anything off the network.
      - name: No external references in the build
        run: |
          if grep -oE '(src|href)="(https?:)?//[^"]*"' build/password-manager.html; then
            echo "::error::external resources are left in build/password-manager.html"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: html-password-manager
          path: |
            build/password-manager.html
            build/password-manager-extension-*.zip
