name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # ubuntu-latest ships Chrome at /usr/bin/google-chrome, where tools/test-app.mjs looks.
      - run: npm run test:browser

      # The single HTML file must not pull anything off the network.
      - name: No external references in the build
        run: |
          if grep -oE '(src|href)="(https?:)?//[^"]*"' build/password-manager.html; then
            echo "::error::external resources are left in build/password-manager.html"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: html-password-manager
          path: build/password-manager.html
